# Rend des Shorts sur les machines de GitHub, une machine par vidéo, sans toucher au PC.
# Lancement à la main : gh workflow run rendre.yml -f videos="Moon-En:moon-en Moon-Es:moon-es"
# Lancement par l'agence (agents/flux.py) : elle pousse file/attente.txt, une composition:nom par ligne
# Récupération : gh run download <id> -D out  (un sous-dossier par vidéo, mp4 gardés 3 jours)
# Mesuré le 31/10 : ~7 min de machine par Short de 40 s, identique au rendu du PC
name: Rendre

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Composition:nom séparés par des espaces (comme scripts/rendre.py)"
        required: true
  push:
    branches: [main]
    paths: [file/attente.txt]

permissions:
  contents: read

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      videos: ${{ steps.liste.outputs.videos }}
    steps:
      - uses: actions/checkout@v5
      - id: liste
        env:
          VIDEOS: ${{ inputs.videos }}
        # L'entrée passe par une variable d'environnement, jamais directement dans le script (injection)
        run: |
          [ -n "$VIDEOS" ] || VIDEOS=$(tr '\n' ' ' < file/attente.txt)
          echo "videos=$(echo "$VIDEOS" | jq -Rc 'split(" ") | map(select(test("^[A-Za-z0-9-]+:[a-z0-9-]+$")))')" >> "$GITHUB_OUTPUT"

  rendu:
    needs: liste
    if: needs.liste.outputs.videos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        video: ${{ fromJson(needs.liste.outputs.videos) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Outils figés dans la release « outils » de studio-rendu, empreinte vérifiée : plus d'apt-get,
      # les serveurs d'Ubuntu sont tombés le 11/11/2026. La police emoji est déjà dans l'image, on vérifie qu'elle y reste.
      - name: Emojis du karaoké et ffmpeg
        timeout-minutes: 5
        env:
          OUTILS: https://github.com/sueurhocqjules-droid/studio-rendu/releases/download/outils
          FFMPEG: ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: e940c45bf07cdf0c95e279a81c5f559ff5dfe88f0f395613bfbbd68566771a45
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$FFMPEG" "$OUTILS/$FFMPEG"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/$FFMPEG" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/$FFMPEG" -C /usr/local/bin --strip-components=2 --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
          ffmpeg -version | head -1
          fc-list | grep -q "Noto Color Emoji" || { echo "::error::Police Noto Color Emoji absente de l'image"; exit 1; }
      - run: npm ci
      - name: Rendu et compression
        env:
          VIDEO: ${{ matrix.video }}
          PYTHONUTF8: "1"
        run: python3 scripts/rendre.py "$VIDEO"
      - id: nom
        env:
          VIDEO: ${{ matrix.video }}
        run: echo "nom=${VIDEO#*:}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nom.outputs.nom }}
          path: out/${{ steps.nom.outputs.nom }}*.mp4
          retention-days: 30   # dépôt public, stockage gratuit : la diffusion Instagram et Facebook reprend le fichier après la sortie YouTube
          if-no-files-found: error
